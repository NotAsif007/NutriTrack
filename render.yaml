services:
  - type: web
    name: nutritrack-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: https://nutritrack-web-vvcu.onrender.com
      - key: COOKIE_SECURE
        value: true

  - type: web
    name: nutritrack-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build --workspace=client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: nutritrack-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
