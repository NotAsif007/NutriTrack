services:
  - type: web
    name: nutritrack-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: nutritrack-web
          property: host
      - key: COOKIE_SECURE
        value: true

  - type: web
    name: nutritrack-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build --workspace=client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: nutritrack-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: nutritrack-health-check
    runtime: node
    plan: free
    schedule: "0 * * * *"
    buildCommand: npm ci
    startCommand: >-
      node -e "const host = process.env.API_HOST; if (!host) process.exit(1);
      fetch('https://' + host + '/api/v1/health').then(async r => {
      console.log(await r.text()); if (!r.ok) process.exit(1);
      }).catch(err => { console.error(err); process.exit(1); });"
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: nutritrack-api
          property: host
